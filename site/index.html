<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CFLP Lab</title>
  <meta name="description" content="Slides and code for the CFLP (Fundamental Concepts of Programming Languages) C# laboratory.">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1a1f;
      --muted: #5b5b66;
      --line: #e4e4ea;
      --accent: #512bd4;
      --accent-soft: #f1edff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131317;
        --fg: #ececf1;
        --muted: #a0a0ad;
        --line: #2a2a33;
        --accent: #a591ff;
        --accent-soft: #221d38;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 820px; margin: 0 auto; padding: 48px 16px 64px; }
    h1 { margin: 0 0 4px; font-size: 2rem; }
    .subtitle { margin: 0 0 32px; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    li {
      /* --lab is set per row from the deck's themeConfig.primary. */
      --lab-accent: var(--lab, var(--accent));
      --lab-soft: color-mix(in srgb, var(--lab-accent) 12%, var(--bg));
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 14px 0 14px 14px;
      border-bottom: 1px solid var(--line);
      border-left: 4px solid var(--lab-accent);
    }
    @media (prefers-color-scheme: dark) {
      li {
        --lab-accent: color-mix(in srgb, var(--lab, var(--accent)) 50%, white);
        --lab-soft: color-mix(in srgb, var(--lab, var(--accent)) 28%, var(--bg));
      }
    }
    .week { color: var(--muted); font-variant-numeric: tabular-nums; }
    .title { font-weight: 600; }
    .links { display: flex; gap: 8px; flex-wrap: wrap; }
    .links a {
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--lab-soft);
      color: var(--lab-accent);
      text-decoration: none;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .links a.optional { background: transparent; border: 1px dashed var(--lab-accent); }
    .links a:hover { text-decoration: underline; }
    footer { margin-top: 32px; color: var(--muted); font-size: 0.9rem; }
    footer a { color: var(--accent); }
    @media (max-width: 560px) {
      li { grid-template-columns: 1fr; gap: 6px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>CFLP Lab</h1>
    <p class="subtitle">C# laboratory · slides and code, published after each lab.</p>
    <ul>
<!-- LABS -->
    </ul>
    <footer>
      <p>Deep-dive sessions are optional and not graded. Assignments and deadlines are on Moodle.</p>
      <p>Clone the <a href="https://github.com/RazvanGolan/cflp-lab">repository</a> and run any demo with <code>dotnet run --project &lt;path&gt;</code>.</p>
    </footer>
  </main>
</body>
</html>

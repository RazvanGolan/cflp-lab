<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CFLP Lab</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <meta name="description" content="Slides and code for the CFLP (Fundamental Concepts of Programming Languages) C# laboratory.">
  <script>
    // Same key and values as Slidev ("auto", "light", "dark"), so the choice is shared with the slides.
    try {
      const saved = localStorage.getItem('slidev-color-schema')
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved
    } catch {}
  </script>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1a1f;
      --muted: #5b5b66;
      --line: #e4e4ea;
      --accent: #512bd4;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #131317;
        --fg: #ececf1;
        --muted: #a0a0ad;
        --line: #2a2a33;
        --accent: #a591ff;
      }
      :root:not([data-theme="light"]) li {
        --lab-accent: color-mix(in srgb, var(--lab, #512bd4) 50%, white);
        --lab-soft: color-mix(in srgb, var(--lab, #512bd4) 28%, var(--bg));
      }
    }
    :root[data-theme="dark"] {
      --bg: #131317;
      --fg: #ececf1;
      --muted: #a0a0ad;
      --line: #2a2a33;
      --accent: #a591ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 820px; margin: 0 auto; padding: 48px 16px 64px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    h1 { margin: 0 0 4px; font-size: 2rem; }
    .subtitle { margin: 0 0 32px; color: var(--muted); }
    #theme-toggle {
      flex: none;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--fg);
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }
    #theme-toggle:hover { border-color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    li {
      /* --lab is set per row from the deck's themeConfig.primary. */
      --lab-accent: var(--lab, var(--accent));
      --lab-soft: color-mix(in srgb, var(--lab-accent) 12%, var(--bg));
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 14px 0 14px 14px;
      border-bottom: 1px solid var(--line);
      border-left: 4px solid var(--lab-accent);
    }
    :root[data-theme="dark"] li {
      --lab-accent: color-mix(in srgb, var(--lab, #512bd4) 50%, white);
      --lab-soft: color-mix(in srgb, var(--lab, #512bd4) 28%, var(--bg));
    }
    .week { color: var(--muted); font-variant-numeric: tabular-nums; }
    .title { font-weight: 600; }
    .links { display: flex; gap: 8px; flex-wrap: wrap; }
    .links a {
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--lab-soft);
      color: var(--lab-accent);
      text-decoration: none;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .links a.optional { background: transparent; border: 1px dashed var(--lab-accent); }
    .links a:hover { text-decoration: underline; }
    footer { margin-top: 32px; color: var(--muted); font-size: 0.9rem; }
    footer a { color: var(--accent); }
    @media (max-width: 560px) {
      li { grid-template-columns: 1fr; gap: 6px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>CFLP Lab</h1>
        <p class="subtitle">C# laboratory · slides and code, published after each lab.</p>
      </div>
      <button id="theme-toggle" type="button">Dark mode</button>
    </header>
    <ul>
<!-- LABS -->
    </ul>
    <footer>
      <p>The second part of each session is optional and not graded. Assignments and deadlines are on CV UPT.</p>
      <p>Clone the <a href="https://github.com/RazvanGolan/cflp-lab">repository</a> and run any demo with <code>dotnet run --project &lt;path&gt;</code>.</p>
    </footer>
  </main>
  <script>
    const root = document.documentElement
    const button = document.getElementById('theme-toggle')
    const systemDark = matchMedia('(prefers-color-scheme: dark)')
    const isDark = () => root.dataset.theme === 'dark' || (!root.dataset.theme && systemDark.matches)
    const render = () => { button.textContent = isDark() ? 'Light mode' : 'Dark mode' }

    button.addEventListener('click', () => {
      const dark = !isDark()
      // Like Slidev: going back to what the system prefers is stored as "auto".
      const value = dark === systemDark.matches ? 'auto' : dark ? 'dark' : 'light'
      if (value === 'auto') delete root.dataset.theme
      else root.dataset.theme = value
      try { localStorage.setItem('slidev-color-schema', value) } catch {}
      render()
    })
    systemDark.addEventListener('change', render)
    render()
  </script>
</body>
</html>
